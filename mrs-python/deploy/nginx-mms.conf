# www.datanex.io.kr 의 기존 server { listen 443 ssl; ... } 블록 안에 추가하세요.
# MRS 는 127.0.0.1:8000 에서 /mms 경로로 동작합니다.

location = /mms { return 301 /mms/; }

location /mms/ {
    proxy_pass         http://127.0.0.1:8000;   # 경로를 그대로 전달 (/mms/... 유지)
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    client_max_body_size 200m;              # 대용량 로그(zip) 업로드
    proxy_read_timeout   300s;              # AI 진단 조언·보고서 생성 대기
}
